<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#4facfe,#00f2fe);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.card{

background:rgba(255,255,255,.18);

backdrop-filter:blur(15px);

border-radius:25px;

padding:40px;

width:600px;

text-align:center;

box-shadow:0 20px 40px rgba(0,0,0,.2);

color:white;

}

.icon{

font-size:70px;

margin-bottom:20px;

}

.btn-download{

background:#fff;

color:#1565C0;

font-weight:600;

padding:14px 35px;

border-radius:50px;

text-decoration:none;

transition:.3s;

display:inline-block;

margin-top:20px;

}

.btn-download:hover{

background:#1565C0;

color:white;

transform:translateY(-4px);

}

.btn-home{

margin-top:15px;

display:inline-block;

color:white;

text-decoration:none;

}

</style>

</head>

<body>

<div class="card">

<div class="icon">

📄

</div>

<h1>

Prediction Report

</h1>

<p class="mt-3">

Your prediction has been generated successfully.

Click below to download your PDF report.

</p>

{% if prediction %}

<h2 class="mt-4">

💧 {{ prediction }} Liters

</h2>

{% endif %}

<a href="{{ url_for('download_pdf') }}"

class="btn-download">

⬇ Download PDF

</a>

<br>

<a href="{{ url_for('home') }}"

class="btn-home">

← Back to Dashboard

</a>

</div>

</body>

</html>
